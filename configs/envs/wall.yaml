# DINO-WM Wall. Requires the DINO-WM Wall environment package (p3_swm) on PYTHONPATH.
env_id: swm/Wall-v0
import_hook: p3_swm.envs
dataset: wall/wall_single.lance
cell: wal10
callables:
  - {method: _set_layout, args: {wall_location: {value: wall_location}, door_location: {value: door_location}}}
  - {method: _set_state, args: {state: {value: state}}}
  - {method: _set_goal_state, args: {goal_state: {value: goal_state}}}
history_keys: [pixels, proprio]
process_keys: [action, proprio, state, wall_location, door_location]
state_col: state
